@if (confirm.pending(); as request) {
  <div
    class="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 p-4"
    (click)="onBackdropClick()"
  >
    <div
      class="relative w-full max-w-md rounded-2xl border p-5 shadow-xl"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-label]="request.title"
      [class.border-dark-border]="ui.isDark()"
      [class.bg-dark-surface]="ui.isDark()"
      [class.border-light-border]="!ui.isDark()"
      [class.bg-light-surface]="!ui.isDark()"
      (click)="onDialogClick($event)"
    >
      <h4
        class="text-base font-semibold"
        [class.text-dark-text-bright]="ui.isDark()"
        [class.text-light-text-bright]="!ui.isDark()"
      >
        {{ request.title }}
      </h4>
      <p
        class="mt-2 text-sm"
        [class.text-dark-text]="ui.isDark()"
        [class.text-light-text]="!ui.isDark()"
      >
        {{ request.message }}
      </p>
      <div class="mt-5 flex items-center justify-end gap-2">
        <button
          class="rounded-lg border px-4 py-2 text-sm font-medium transition-colors"
          type="button"
          [class.border-dark-border]="ui.isDark()"
          [class.text-dark-text]="ui.isDark()"
          [class.border-light-border]="!ui.isDark()"
          [class.text-light-text]="!ui.isDark()"
          (click)="confirm.decline()"
        >
          {{ 'COMMON.CANCEL' | translate }}
        </button>
        <button
          class="rounded-lg bg-danger px-4 py-2 text-sm font-semibold text-white transition-colors"
          type="button"
          (click)="confirm.accept()"
        >
          {{ 'COMMON.CONFIRM' | translate }}
        </button>
      </div>
    </div>
  </div>
}
